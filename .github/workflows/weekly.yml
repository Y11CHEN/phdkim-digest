name: Weekly phdkim Digest

on:
  schedule:
    - cron: '0 0 * * 0'   # Every Sunday at UTC 00:00
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write           # Allow Actions to commit files

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/retranslate.py --weekly

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json docs/index.html
          git diff --staged --quiet || git commit -m "chore: weekly digest $(date -u +%Y-%m-%d)"
          git push
